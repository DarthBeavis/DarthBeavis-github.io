<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CenterPoint Internal Lead Messaging</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; }
    .wrap { padding: 16px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 16px; max-width: 900px; }
    h1 { margin-top: 0; }
    .context { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .field { border: 1px solid #ddd; border-radius: 6px; padding: 8px; background: #fafcff; }
    .field.hidden { display: none; }
    .label { font-size: 11px; color: #666; margin-bottom: 3px; }
    .value { font-size: 14px; }
    .status { margin-bottom: 10px; font-size: 13px; }
    #genesys-messenger { min-height: 500px; border: 1px dashed #ccc; border-radius: 8px; }
  </style>
  <script>
    // Clear Genesys widget session storage to force a fresh conversation
    (function() {
      try {
        var dbNames = ['gcmessenger', 'genesys-messenger', 'gcmessaging'];
        dbNames.forEach(function(name) {
          try { indexedDB.deleteDatabase(name); } catch(e) {}
        });
        // Also clear relevant localStorage keys
        Object.keys(localStorage).forEach(function(k) {
          if (k.indexOf('genesys') !== -1 || k.indexOf('gcmessenger') !== -1 || k.indexOf('_gcmw') !== -1) {
            localStorage.removeItem(k);
          }
        });
      } catch(e) {}
    })();
  </script>

    (function (g, e, n, es, ys) {
      g['_genesysJs'] = e;
      g[e] = g[e] || function () { (g[e].q = g[e].q || []).push(arguments); };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement('script');
      ys.async = 1;
      ys.src = n;
      ys.charset = 'utf-8';
      document.head.appendChild(ys);
    })(window, 'Genesys', 'https://apps.usw2.pure.cloud/genesys-bootstrap/genesys.min.js', {
      environment: 'prod-usw2',
      deploymentId: 'c8027828-154c-4b1d-8b54-67b6e549f82f'
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Internal Lead Messaging</h1>
      <div class="context">
        <div class="field hidden" id="queueField">
          <div class="label">Queue</div>
          <div class="value" id="queueValue"></div>
        </div>
        <div class="field hidden" id="subjectField">
          <div class="label">Subject</div>
          <div class="value" id="subjectValue"></div>
        </div>
        <div class="field hidden" id="agentNameField">
          <div class="label">Agent</div>
          <div class="value" id="agentNameValue"></div>
        </div>
        <div class="field hidden" id="employeeIdField">
          <div class="label">Employee ID</div>
          <div class="value" id="employeeIdValue"></div>
        </div>
        <div class="field hidden" id="originalConversationIdField" style="grid-column:1/-1;">
          <div class="label">Original Conversation ID</div>
          <div class="value" id="originalConversationIdValue"></div>
        </div>
      </div>
      <div id="status" class="status">Loading widget...</div>
      <div id="genesys-messenger"></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var _initialized = false;

      var params = new URLSearchParams(window.location.search);
      var config = {
        queue:                  (params.get('queue')                  || '').trim(),
        agentName:              (params.get('agentName')              || '').trim(),
        employeeId:             (params.get('employeeId')             || '').trim(),
        subject:                (params.get('subject')                || '').trim(),
        originalConversationId: (params.get('originalConversationId') || '').trim()
      };

      function setStatus(msg) {
        var el = document.getElementById('status');
        if (el) el.innerText = msg;
        console.log('[LeadChat]', msg);
      }

      function bindField(fieldId, valueId, value) {
        var field  = document.getElementById(fieldId);
        var target = document.getElementById(valueId);
        if (!field || !target) return;
        if (!value) { field.classList.add('hidden'); return; }
        target.textContent = value;
        field.classList.remove('hidden');
      }

      bindField('queueField',                  'queueValue',                  config.queue);
      bindField('subjectField',                'subjectValue',                config.subject);
      bindField('agentNameField',              'agentNameValue',              config.agentName);
      bindField('employeeIdField',             'employeeIdValue',             config.employeeId);
      bindField('originalConversationIdField', 'originalConversationIdValue', config.originalConversationId);

      function dbSetAttribute(key, value) {
        return new Promise(function (resolve, reject) {
          Genesys('command', 'Database.set', {
            messaging: { customAttributes: { [key]: value } }
          }, resolve, reject);
        });
      }

      async function setConversationAttributes() {
        var attrs = {
          queue:                  config.queue,
          agentName:              config.agentName,
          employeeId:             config.employeeId,
          subject:                config.subject,
          originalConversationId: config.originalConversationId
        };
        for (var [key, value] of Object.entries(attrs)) {
          if (!value) continue;
          try {
            await dbSetAttribute(key, value);
            console.log('[LeadChat] Set attribute:', key, '=', value);
          } catch(e) {
            console.error('[LeadChat] Failed to set attribute:', key, e);
          }
        }
      }

      Genesys('subscribe', 'Messenger.ready', async function () {
        if (_initialized) {
          console.log('[LeadChat] Messenger.ready fired again — skipping');
          return;
        }
        _initialized = true;
        setStatus('Messenger ready. Setting attributes...');
        await setConversationAttributes();
