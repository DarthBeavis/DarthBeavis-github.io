<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadChat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e4ec;
      --muted: #6b7089;
      --accent: #4f8ef7;
      --ok: #3ecf8e;
      --warn: #f5a623;
      --error: #f04d4d;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: clamp(8px, 2vw, 16px);
      gap: 10px;
      min-height: 100%;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
      box-shadow: 0 0 5px var(--accent);
    }
    .header-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status bar ── */
    #status {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color 0.2s, border-color 0.2s;
      flex-shrink: 0;
      word-break: break-word;
      line-height: 1.4;
    }
    #status.ok    { color: var(--ok);    border-color: var(--ok); }
    #status.warn  { color: var(--warn);  border-color: var(--warn); }
    #status.error { color: var(--error); border-color: var(--error); }

    /* ── Fields ── */
    .fields {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .field {
      display: grid;
      grid-template-columns: minmax(90px, max-content) 1fr;
      gap: 6px;
      align-items: start;
    }
    .field.hidden { display: none; }

    .field-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding-top: 5px;
      text-align: right;
      white-space: nowrap;
    }

    .field-value {
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 4px 8px;
      word-break: break-all;
      line-height: 1.4;
      min-width: 0;
    }

    #leadConversationIdField .field-value {
      color: var(--ok);
      border-color: var(--ok);
    }

    /* ── Narrow iframe: stack label above value ── */
    @media (max-width: 320px) {
      .field {
        grid-template-columns: 1fr;
      }
      .field-label {
        text-align: left;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-dot"></div>
    <span class="header-title">LeadChat — Internal Messaging</span>
  </div>

  <div id="status">Initializing...</div>

  <div class="fields">
    <div class="field hidden" id="queueField">
      <span class="field-label">Queue</span>
      <span class="field-value" id="queueValue"></span>
    </div>
    <div class="field hidden" id="agentNameField">
      <span class="field-label">Agent</span>
      <span class="field-value" id="agentNameValue"></span>
    </div>
    <div class="field hidden" id="employeeIdField">
      <span class="field-label">Employee ID</span>
      <span class="field-value" id="employeeIdValue"></span>
    </div>
    <div class="field hidden" id="subjectField">
      <span class="field-label">Subject</span>
      <span class="field-value" id="subjectValue"></span>
    </div>
    <div class="field hidden" id="originalConversationIdField">
      <span class="field-label">Original Conv ID</span>
      <span class="field-value" id="originalConversationIdValue"></span>
    </div>
    <div class="field hidden" id="leadConversationIdField">
      <span class="field-label">Lead Conv ID</span>
      <span class="field-value" id="leadConversationIdValue"></span>
    </div>
  </div>

  <!-- Genesys Messenger bootstrap -->
  <script>
    (function (g, e, n, es, ys) {
      g["_genesysJs"] = e;
      g[e] = g[e] || function () {
        (g[e].q = g[e].q || []).push(arguments);
      };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement("script");
      ys.async = 1;
      ys.src = n;
      ys.charset = "utf-8";
      document.head.appendChild(ys);
    })(window, "Genesys", "https://apps.usw2.pure.cloud/genesys-bootstrap/genesys.min.js", {
      environment: "prod",
      deploymentId: "c8027828-154c-4b1d-8b54-67b6e549f82f"
    });
  </script>

  <script>
    (function () {
      "use strict";

      // ── Guard flag — Messenger.ready can fire multiple times ──────────
      var _initialized = false;

      // ── Parse URL params ──────────────────────────────────────────────
      var params = new URLSearchParams(window.location.search);
      var config = {
        queue:                  (params.get("queue")                  || "").trim(),
        agentName:              (params.get("agentName")              || "").trim(),
        employeeId:             (params.get("employeeId")             || "").trim(),
        subject:                (params.get("subject")                || "").trim(),
        originalConversationId: (params.get("originalConversationId") || "").trim()
      };

      // ── Status helper ─────────────────────────────────────────────────
      var statusEl = document.getElementById("status");
      function setStatus(msg, cssClass) {
        statusEl.textContent = msg;
        statusEl.className = cssClass || "";
        console.log("[LeadChat]", msg);
      }

      // ── Bind a URL param to its display field ─────────────────────────
      function bindField(fieldId, valueId, value) {
        var field = document.getElementById(fieldId);
        var target = document.getElementById(valueId);
        if (!field || !target) return;
        if (!value) {
          field.classList.add("hidden");
          return;
        }
        target.textContent = value;
        field.classList.remove("hidden");
      }

      bindField("queueField",                  "queueValue",                  config.queue);
      bindField("agentNameField",              "agentNameValue",              config.agentName);
      bindField("employeeIdField",             "employeeIdValue",             config.employeeId);
      bindField("subjectField",                "subjectValue",                config.subject);
      bindField("originalConversationIdField", "originalConversationIdValue", config.originalConversationId);

      // ── Show lead conversation ID once we have it ─────────────────────
      function showLeadConversationId(conversationId) {
        if (!conversationId) return;
        var field = document.getElementById("leadConversationIdField");
        var value = document.getElementById("leadConversationIdValue");
        if (field && value) {
          value.textContent = conversationId;
          field.classList.remove("hidden");
        }
      }

      // ── Database.set wrapper (returns Promise) ────────────────────────
      function dbSetAttribute(key, value) {
        return new Promise(function (resolve, reject) {
          Genesys("command", "Database.set", {
            messaging: {
              customAttributes: { [key]: value }
            }
          }, resolve, reject);
        });
      }

      // ── Set all non-empty config attributes sequentially ─────────────
      async function setConversationAttributes() {
        var attrs = {
          queue:                  config.queue,
          agentName:              config.agentName,
          employeeId:             config.employeeId,
          subject:                config.subject,
          originalConversationId: config.originalConversationId
        };
        for (var [key, value] of Object.entries(attrs)) {
          if (!value) continue;
          await dbSetAttribute(key, value);
        }
      }

      // ── Messenger.ready — guard ensures init runs exactly once ────────
      Genesys("subscribe", "Messenger.ready", async function () {
        if (_initialized) {
          console.log("[LeadChat] Messenger.ready fired again — skipping (already initialized)");
          return;
        }
        _initialized = true;

        try {
          setStatus("Messenger ready. Applying conversation attributes...", "warn");
          await setConversationAttributes();

          Genesys("command", "Messenger.open", {}, function () {
            setStatus("Messenger opened. Waiting for conversation...", "ok");
          }, function (err) {
            console.error("[LeadChat] Messenger.open failed", err);
            setStatus("Failed to open messenger: " + (err && err.message ? err.message : String(err)), "error");
          });
        } catch (err) {
          console.error("[LeadChat] Attribute initialization failed", err);
          setStatus("Failed to initialize: " + (err && err.message ? err.message : String(err)), "error");
        }
      });

      // ── Conversation started ──────────────────────────────────────────
      Genesys("subscribe", "MessagingService.conversationStarted", function (event) {
        var conversationId = event && event.data && event.data.conversationId
          ? event.data.conversationId : "";
        if (conversationId) {
          showLeadConversationId(conversationId);
          setStatus("Conversation started.", "ok");
        }
      });

      // ── Session started (handles reconnect case) ──────────────────────
      Genesys("subscribe", "MessagingService.sessionStarted", function (event) {
        var conversationId = event && event.data && event.data.conversationId
          ? event.data.conversationId : "";
        if (conversationId) {
          showLeadConversationId(conversationId);
        }
      });

      setStatus("Loading Genesys Messenger...");

    })();
  </script>

</body>
</html>
