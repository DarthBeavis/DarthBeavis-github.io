<script>
  console.log("Widget loading...");
  window.Genesys = window.Genesys || function () {
    (window.Genesys.q = window.Genesys.q || []).push(arguments);
  };

  Genesys('subscribe', 'MessagingService.ready', function () {
    console.log("MessagingService.ready fired");
    Genesys('command', 'Messenger.open', {}, function () {
      console.log("Messenger opened");
    }, function (err) {
      console.error("Messenger open failed", err);
    });
  });
</script>
