<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CenterPoint Internal Lead Messaging</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .wrap {
      padding: 16px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      max-width: 900px;
    }

    h1 {
      margin-top: 0;
    }

    .context {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .field {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      background: #fafcff;
    }

    .field.hidden {
      display: none;
    }

    .label {
      font-size: 11px;
      color: #666;
      margin-bottom: 3px;
    }

    .value {
      font-size: 14px;
    }

    .status {
      margin-bottom: 10px;
      font-size: 13px;
    }

    #genesys-messenger {
      min-height: 500px;
      border: 1px dashed #ccc;
      border-radius: 8px;
    }
  </style>
