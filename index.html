<script>
  (function (g, e, n, es, ys) {
    g["_genesysJs"] = e;
    g[e] = g[e] || function () {
      (g[e].q = g[e].q || []).push(arguments);
    };
    g[e].t = 1 * new Date();
    g[e].c = es;
    ys = document.createElement("script");
    ys.async = 1;
    ys.src = n;
    ys.charset = "utf-8";
    document.head.appendChild(ys);
  })(window, "Genesys", "https://apps.usw2.pure.cloud/genesys-bootstrap/genesys.min.js", {
    environment: "prod",
    deploymentId: "c8027828-154c-4b1d-8b54-67b6e549f82f"
  });
</script>

<script>
  console.log("Widget loading...");

  (function () {
    const params = new URLSearchParams(window.location.search);

    const config = {
      queue: (params.get("queue") || "").trim(),
      agentName: (params.get("agentName") || "").trim(),
      employeeId: (params.get("employeeId") || "").trim(),
      subject: (params.get("subject") || "").trim(),
      originalConversationId: (params.get("originalConversationId") || "").trim()
    };

    const statusEl = document.getElementById("status");

    function setStatus(message, cssClass) {
      statusEl.textContent = message;
      statusEl.className = "status" + (cssClass ? " " + cssClass : "");
      console.log("[STATUS]", message);
    }

    function bindField(fieldId, valueId, value) {
      const field = document.getElementById(fieldId);
      const target = document.getElementById(valueId);
      if (!field || !target) return;
      if (!value) {
        field.classList.add("hidden");
        return;
      }
      target.textContent = value;
    }

    bindField("queueField", "queueValue", config.queue);
    bindField("subjectField", "subjectValue", config.subject);
    bindField("agentNameField", "agentNameValue", config.agentName);
    bindField("employeeIdField", "employeeIdValue", config.employeeId);
    bindField("originalConversationIdField", "originalConversationIdValue", config.originalConversationId);

    function showLeadConversationId(conversationId) {
      const field = document.getElementById("leadConversationIdField");
      const value = document.getElementById("leadConversationIdValue");
      if (field && value && conversationId) {
        value.textContent = conversationId;
        field.classList.remove("hidden");
      }
    }

    function dbSetAttribute(key, value) {
      return new Promise(function (resolve, reject) {
        Genesys("command", "Database.set", {
          messaging: {
            customAttributes: {
              [key]: value
            }
          }
        }, resolve, reject);
      });
    }

    async function setConversationAttributes() {
      const attrs = {
        queue: config.queue,
        agentName: config.agentName,
        employeeId: config.employeeId,
        subject: config.subject,
        originalConversationId: config.originalConversationId
      };

      for (const [key, value] of Object.entries(attrs)) {
        if (!value) continue;
        await dbSetAttribute(key, value);
      }
    }

    Genesys("subscribe", "MessagingService.ready", async function () {
      try {
        setStatus("Messenger ready. Applying conversation attributes...", "warn");
        await setConversationAttributes();

        Genesys("command", "Messenger.open", {}, function () {
          setStatus("Messenger opened.", "ok");
        }, function (err) {
          console.error("Messenger.open failed", err);
          setStatus("Failed to open messenger.", "error");
        });
      } catch (err) {
        console.error("Attribute initialization failed", err);
        setStatus("Failed to initialize messenger: " + (err.message || String(err)), "error");
      }
    });

    Genesys("subscribe", "MessagingService.conversationStarted", function (event) {
      const conversationId = event && event.data && event.data.conversationId ? event.data.conversationId : "";
      if (conversationId) {
        showLeadConversationId(conversationId);
        setStatus("Conversation started.", "ok");
      }
    });

    Genesys("subscribe", "MessagingService.sessionStarted", function (event) {
      const conversationId = event && event.data && event.data.conversationId ? event.data.conversationId : "";
      if (conversationId) {
        showLeadConversationId(conversationId);
      }
    });
  })();
</script>
